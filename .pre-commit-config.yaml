# The CI gate, moved to commit time.
#
# Every Python hook below is `language: system`, calling tools already installed
# in the environment and reading `pyproject.toml`.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: local
    hooks:
      # Notebooks are committed clean: outputs, execution counts and run-specific metadata
      # bloat the diffs and push executed notebooks past check-added-large-files (2 MB).
      # nbstripout is installed once per machine (`uv tool install nbstripout`). It rewrites
      # the file and fails the commit once; `git add` the cleaned notebook and commit again.
      - id: nbstripout
        name: strip notebook outputs
        entry: nbstripout --extra-keys "metadata.language_info.version metadata.language_info.codemirror_mode metadata.language_info.pygments_lexer metadata.language_info.nbconvert_exporter metadata.language_info.file_extension metadata.language_info.mimetype metadata.widgets cell.metadata.execution cell.metadata.collapsed cell.metadata.scrolled"
        language: system
        files: '\.ipynb$'

      - id: ruff
        name: ruff check (python & notebooks)
        entry: ruff check
        language: system
        types_or: [python, jupyter]

      - id: compile-materials
        name: compile course materials (pandoc / latexmk)
        entry: make all
        language: system
        files: '(\.md$|\.tex$|\.bib$|Makefile|Makefile\.inc|config\.yml|defaults\.yml)$'
        pass_filenames: false
