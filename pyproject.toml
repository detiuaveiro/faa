[project]
name = "faa"
version = "0.1.0"
description = "Support files, slides, and practical materials for Fundamentos de Aprendizagem Automática (FAA)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mário Antunes", email = "mario.antunes@ua.pt"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.basedpyright]
typeCheckingMode = "basic"
failOnWarnings = false
include = ["notebooks"]

[tool.ruff]
line-length = 120
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
